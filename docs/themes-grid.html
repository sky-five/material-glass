<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Material Glass themes</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0b0f10; font-family: Figtree, system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 360px); gap: 16px; padding: 16px; width: max-content; }
  figure { margin: 0; }
  .frame { width: 360px; height: 225px; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12); }
  iframe { width: 1440px; height: 900px; border: 0; transform: scale(0.25); transform-origin: 0 0; pointer-events: none; }
  figcaption { margin-top: 8px; color: #e6edeb; font-size: 15px; font-weight: 700; }
  figcaption span { color: #8b9391; font-weight: 600; }
</style>
</head>
<body>
<div class="grid">
  <figure><div class="frame"><iframe title="Sea Glass" src="../index.html?theme=sea-glass&mode=dark&glass=frosted"></iframe></div><figcaption>Sea Glass <span>dark</span></figcaption></figure>
  <figure><div class="frame"><iframe title="Prism" src="../index.html?theme=prism&mode=light&glass=frosted"></iframe></div><figcaption>Prism <span>light</span></figcaption></figure>
  <figure><div class="frame"><iframe title="Obsidian" src="../index.html?theme=obsidian&mode=dark&glass=frosted"></iframe></div><figcaption>Obsidian <span>dark</span></figcaption></figure>
  <figure><div class="frame"><iframe title="Frost" src="../index.html?theme=frost&mode=light&glass=frosted"></iframe></div><figcaption>Frost <span>light</span></figcaption></figure>
  <figure><div class="frame"><iframe title="Ember" src="../index.html?theme=ember&mode=dark&glass=frosted"></iframe></div><figcaption>Ember <span>dark</span></figcaption></figure>
  <figure><div class="frame"><iframe title="Aurora" src="../index.html?theme=aurora&mode=dark&glass=frosted"></iframe></div><figcaption>Aurora <span>dark</span></figcaption></figure>
  <figure><div class="frame"><iframe title="Mono" src="../index.html?theme=mono&mode=light&glass=frosted"></iframe></div><figcaption>Mono <span>light</span></figcaption></figure>
  <figure><div class="frame"><iframe title="Sand" src="../index.html?theme=sand&mode=light&glass=frosted"></iframe></div><figcaption>Sand <span>light</span></figcaption></figure>
</div>
</body>
</html>
