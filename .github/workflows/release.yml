name: Release

# Push a tag like v0.2.0 to publish. Release notes come from CHANGELOG.md.
# npm publishing runs only when the NPM_TOKEN repository secret exists.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Built files match the tag
        run: git diff --exit-code -- material-glass.css material-glass.min.css material-glass.min.js dist/
      - run: npm test
      - run: npm run build:packages && npm run test:packages
      - name: Version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on && $0 !~ /^\[[0-9]/' CHANGELOG.md > notes.md
          test -s notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Material Glass $GITHUB_REF_NAME" --notes-file notes.md
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Publish framework packages to npm (needs the @material-glass npm org)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspaces --provenance --access public
