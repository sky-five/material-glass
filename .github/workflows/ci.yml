name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated themes are up to date
        run: npm run themes && git diff --exit-code -- tokens/
      - name: Build CSS from tokens
        run: npm run build
      - name: Generated CSS is committed
        run: git diff --exit-code -- material-glass.css material-glass.min.css material-glass.min.js dist/ demo/themes.js
      - name: CSS parses cleanly, WCAG contrast checks
        run: npm test
