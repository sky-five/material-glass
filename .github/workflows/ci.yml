name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build CSS from tokens
        run: npm run build
      - name: Generated CSS is committed
        run: git diff --exit-code -- material-glass.css
      - name: WCAG contrast checks
        run: npm test
